name: gcinside

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gcinside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gcinside}
      POSTGRES_DB: ${POSTGRES_DB:-gcinside}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gcinside}"]
      interval: 5s
      retries: 10
    networks:
      - gcinside

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      - gcinside

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniominio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    networks:
      - gcinside

  ai-inference:
    build:
      context: ../../gcinside-ai-inference
    environment:
      AI_INFERENCE_TOKEN: ${AI_INFERENCE_TOKEN:-}
      MODEL_NAME: ${MODEL_NAME:-mock-risk-v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8081:8081"
    depends_on:
      minio:
        condition: service_started
    networks:
      - gcinside

  abuse-worker:
    build:
      context: ../../gcinside-abuse-worker
    environment:
      QUEUE_URL: ${QUEUE_URL:-memory://}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gcinside}:${POSTGRES_PASSWORD:-gcinside}@postgres:5432/${POSTGRES_DB:-gcinside}
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_URL: http://minio:9000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gcinside

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  gcinside:
    driver: bridge
